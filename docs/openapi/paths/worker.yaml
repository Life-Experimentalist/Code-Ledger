# Every route below exists in worker/src/index.js, in this order.
# The `/api/app/*` token-minting routes and `/api/post_install` were removed
# when the project moved from a GitHub App to a classic OAuth App.

/api/health:
  get:
    tags: [health]
    summary: Health check
    description: Returns a minimal JSON health payload for uptime monitoring. Sent with permissive CORS headers.
    responses:
      "200":
        description: Health payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthResponse"
  options:
    tags: [health]
    summary: CORS preflight
    responses:
      "204":
        description: Permissive CORS headers, empty body

/api/auth/{provider}:
  get:
    tags: [auth]
    summary: Initiate the OAuth flow
    description: |
      Issues an HMAC-signed `state` value with a 10-minute lifetime, sets it in an
      `HttpOnly; Secure; SameSite=Lax` cookie scoped to `/api/auth`, and redirects to
      GitHub's authorization page.

      `SameSite=Lax` is deliberate: the callback arrives as a top-level GET navigation
      from github.com, which Lax permits and Strict would block.

      The `scope` query parameter is an allow-list, not a pass-through. Anything not
      recognised falls back to the least-privilege default (`public_repo,workflow`).
      `repo,workflow` is the only wider value accepted, and only for users who opt in
      to a private ledger.
    parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum: [github]
      - in: query
        name: scope
        required: false
        description: Requested OAuth scope. Unrecognised values silently become the default.
        schema:
          type: string
          enum: [public_repo, "public_repo,workflow", repo, "repo,workflow"]
          default: public_repo,workflow
    responses:
      "302":
        description: Redirect to GitHub's authorization URL
        headers:
          Location:
            schema:
              type: string
          Set-Cookie:
            description: The signed `state` cookie, `Max-Age=600`
            schema:
              type: string
      "404":
        description: Unsupported provider
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "500":
        description: |
          The worker is missing `CODELEDGER_OAUTH_CLIENT_ID` or `SESSION_SECRET`,
          or the client ID is present but not shaped like one. Without a session
          secret the state cookie cannot be signed, so sign-in fails closed rather
          than proceeding unauthenticated; and a malformed client ID is rejected
          here rather than percent-encoded into the authorize URL, where GitHub
          answers with a generic login redirect that names no cause.
        content:
          text/plain:
            schema:
              type: string

/api/auth/github/callback:
  get:
    tags: [auth]
    summary: OAuth callback receiver
    description: |
      Verifies the signed `state` cookie in constant time before anything else —
      including before honouring `error`/`error_description`, so an attacker cannot
      render arbitrary text on the page by linking to the callback directly. GitHub
      echoes `state` on error redirects, so genuine denials still verify. On success
      the cookie is cleared and the code exchanged.

      Always answers `200` with an HTML page carrying
      `{ type: "CODELEDGER_AUTH", provider, token, error }` — failures travel inside
      that payload so the extension sees them, rather than as an HTTP status the
      popup cannot read. The payload is delivered as the `data-auth` attribute of
      `#codeledger-auth-result`, read by the extension's content script at
      document_end; an origin-locked same-window `postMessage` is the fallback for
      timing races. Nothing is posted to an opener window.

      If GitHub returns an App-shaped token response (`expires_in` or `refresh_token`
      present, `scope` absent), the worker refuses it and reports the misconfiguration.
      A GitHub App issues user-to-server tokens that ignore the requested scope and
      cannot call `POST /user/repos`, which would otherwise surface much later as an
      unexplained 403 during repository creation.
    parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      - in: query
        name: error_description
        schema:
          type: string
    responses:
      "200":
        description: |
          HTML page carrying the token (or an error string) in `data-auth`.

          This is the one response in the worker that hands out a repo-scoped GitHub
          token through the DOM, so the page is locked down: `default-src 'none'` with
          no `connect-src`, meaning an injected script has nowhere to send the token
          even if one ran. The inline `<style>` and `<script>` carry a per-response
          nonce; a static hash would not work, because the script embeds the token and
          so differs on every response.
        headers:
          Content-Security-Policy:
            description: |
              `default-src 'none'; script-src 'nonce-…'; style-src 'nonce-…';
              base-uri 'none'; form-action 'none'; frame-ancestors 'none'`.
              The nonce is fresh per response and matches the one on the inline tags.
            schema:
              type: string
          X-Frame-Options:
            description: "`DENY` — the same as `frame-ancestors`, for older browsers"
            schema:
              type: string
          X-Content-Type-Options:
            schema:
              type: string
              enum: [nosniff]
          Set-Cookie:
            description: Clears the `state` cookie
            schema:
              type: string
        content:
          text/html:
            schema:
              type: string

/api/webhook/github:
  post:
    tags: [webhook]
    summary: GitHub webhook receiver
    description: |
      Fails closed. An unset `CODELEDGER_GH_APP_WEBHOOK_SECRET` returns 503 rather than
      skipping verification, which would leave the endpoint open to forged deliveries.
      The `x-hub-signature-256` HMAC is compared in constant time.
    parameters:
      - in: header
        name: x-hub-signature-256
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json: {}
    responses:
      "200":
        description: Signature verified
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OKResponse"
      "401":
        description: Missing or invalid signature
        content:
          text/plain:
            schema:
              type: string
      "503":
        description: No webhook secret configured
        content:
          text/plain:
            schema:
              type: string

/api/data/canonical-map.json:
  get:
    tags: [data]
    summary: Canonical map (public)
    description: Serves the canonical map from KV when bound and populated, otherwise from a raw GitHub fallback. Cached for one hour.
    responses:
      "200":
        description: Canonical map JSON
        content:
          application/json: {}
      "503":
        description: Neither KV nor the GitHub fallback returned a map
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
  options:
    tags: [data]
    summary: CORS preflight (covers /api/data/*)
    responses:
      "204":
        description: Permissive CORS headers, empty body

/api/admin/canonical:
  post:
    tags: [data]
    summary: "Admin: replace the canonical map"
    description: |
      Requires a bearer token matching `CANONICAL_UPLOAD_TOKEN`, compared in constant
      time. The body must parse as JSON **and** validate as a canonical map before
      anything is written: entries may be a bare array or live under `.entries`, and
      every entry needs `canonicalId`, `canonicalTitle`, `topic`, `difficulty` and at
      least one platform alias. Bodies over 10 MiB are rejected before parsing.
      Deliberately sends no CORS headers, so a browser on another origin cannot call it.
    security:
      - canonical_token: []
    requestBody:
      required: true
      content:
        text/plain: {}
    responses:
      "200":
        description: Stored at KV key `canonical-map`
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OKResponse"
      "400":
        description: Body is not valid JSON, or does not validate as a canonical map
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Missing or wrong bearer token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "413":
        description: Body exceeds the 10 MiB limit
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "500":
        description: The `CANONICAL_MAP` KV namespace is not bound
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "503":
        description: No `CANONICAL_UPLOAD_TOKEN` configured, so uploads are disabled
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/favicon.ico:
  get:
    tags: [misc]
    summary: Favicon redirect
    responses:
      "301":
        description: Redirect to the extension icon on raw.githubusercontent.com

/{path}:
  get:
    tags: [misc]
    summary: Static landing page
    description: |
      Catch-all, registered last. Serves `worker/public/` through the `ASSETS`
      binding. There is no `/library` route — the extension's library UI is not
      deployed as a hosted web app.

      `/compare` is one of these static pages rather than an endpoint. It takes
      a `?repos=owner/repo,owner/repo` list, and reads each repository's public
      `badges/stats.json` from `raw.githubusercontent.com` in the browser. The
      worker never sees the list and stores nothing: the URL is the state.
    parameters:
      - in: path
        name: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Static asset
        content:
          text/html:
            schema:
              type: string
      "404":
        description: No such asset
