name: Release

on:
  push:
    tags:
      - "v*.*.*" # triggers on v1.1.0, v2.0.0-rc.1, etc.

permissions:
  contents: write # needed to create GitHub Releases and upload assets

jobs:
  build-and-release:
    name: Build & publish extension packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── Node / npm setup ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Sync regression checks
        run: npm run test:sync-regression

      # ── Derive version from git tag ──────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v1.1.0
          VERSION="${TAG#v}"                 # strip leading 'v'
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ── Validate manifest version matches tag ────────────────────────────
      - name: Validate manifest version
        run: |
          MANIFEST_VER=$(node -p "JSON.parse(require('fs').readFileSync('src/manifest.json','utf8')).version")
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VER" != "$TAG_VER" ]; then
            echo "::error::manifest.json version ($MANIFEST_VER) does not match tag ($TAG_VER)"
            exit 1
          fi
          echo "Versions match: $MANIFEST_VER"

      # ── Build + Package (CSS → dist → chromium + firefox + source zips) ────
      - name: Build and package all artifacts
        run: npm run publish

      # ── Locate built archives ────────────────────────────────────────────
      - name: List dist artifacts
        run: ls -lh releases/${{ steps.version.outputs.version }}/

      # ── Generate release notes from CHANGELOG ────────────────────────────
      - name: Extract release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Use the Node script — handles --- separators and multi-line content correctly
          if node dev/v2/tasks/extract-changelog.js "$VERSION" > /tmp/release_notes.md; then
            printf '\n\nSee [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md) for full details.' >> /tmp/release_notes.md
          else
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md) for full details." > /tmp/release_notes.md
          fi
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      # ── Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CodeLedger ${{ steps.version.outputs.tag }}"
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            releases/${{ steps.version.outputs.version }}/codeledger-chromium-v*.zip
            releases/${{ steps.version.outputs.version }}/codeledger-firefox-v*.zip
            releases/${{ steps.version.outputs.version }}/codeledger-source-v*.zip

      # ── Summary ─────────────────────────────────────────────────────────
      - name: Print release URL
        run: echo "Release published at ${{ steps.release.outputs.url }}"
