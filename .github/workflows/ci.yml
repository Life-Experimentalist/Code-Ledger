name: CI

# Every gate the release workflow runs, run here too — on every push and pull
# request. Release-time is the wrong place to discover a broken test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The auto-heal step pushes a formatting fix back to the branch on push
    # events; fork PRs are downgraded to read automatically.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The root test glob includes worker/test/**, and those import
      # worker/src/index.js, which imports hono. Without this the worker suite
      # fails to load and the run dies on a module-resolution error that looks
      # nothing like a test failure.
      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Type check
        run: npm run lint

      # Drift that a script can fix must not block the pipeline. Three of the
      # gates below reject exactly that kind of drift: Prettier formatting,
      # the version copied from package.json into the manifests and landing
      # page, and the host_permissions generated from the handlers' DOMAINS
      # exports. On a push, run the fixers themselves and push the result
      # back as a bot commit, then carry on gating the healed tree. A
      # GITHUB_TOKEN push does not trigger another workflow run, and every
      # fixer is idempotent, so this cannot loop. Pull requests keep the
      # blocking checks — a fork's token cannot push back. The generators
      # run first so anything they write gets formatted; a sync-manifests
      # failure (landing-page pattern gone) is real breakage and still fails.
      - name: Auto-heal formatting and generated files (push)
        if: github.event_name == 'push'
        run: |
          node dev/sync-manifests.js
          node dev/generate-manifest-domains.js
          npm run format
          if git diff --quiet; then
            echo "no drift — nothing to heal"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: auto-heal formatting and generated-file drift"
          git push origin "HEAD:${{ github.ref_name }}" ||
            echo "::warning::branch moved before the heal commit could land — the next push heals it"

      - name: Format check
        if: github.event_name != 'push'
        run: npm run format:check

      - name: Unit and worker tests
        run: npm test

      - name: Sync regression checks
        run: npm run test:sync-regression

      - name: Validate OpenAPI spec
        run: npm run validate:openapi

      # The two manifests and package.json must agree on the version, and the
      # manifests' host_permissions are generated from the handlers' DOMAINS
      # exports. Both drift silently, so check them rather than trusting them.
      - name: Check manifest versions agree
        run: |
          PKG=$(node -p "require('./package.json').version")
          CHROMIUM=$(node -p "require('./src/manifest-chromium.json').version")
          FIREFOX=$(node -p "require('./src/manifest-firefox.json').version")
          echo "package.json=$PKG chromium=$CHROMIUM firefox=$FIREFOX"
          if [ "$PKG" != "$CHROMIUM" ] || [ "$PKG" != "$FIREFOX" ]; then
            echo "::error::version mismatch between package.json and the manifests"
            exit 1
          fi

      - name: Check generated host_permissions are current
        run: |
          node dev/generate-manifest-domains.js
          if ! git diff --quiet -- src/manifest-chromium.json src/manifest-firefox.json; then
            echo "::error::host_permissions are stale — run 'npm run domains:update' and commit"
            git --no-pager diff -- src/manifest-chromium.json src/manifest-firefox.json
            exit 1
          fi

  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Proves the packaging path still works without waiting for a tag push.
      - name: Build and package
        run: npm run publish

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: codeledger-packages
          path: releases/*/codeledger-*.zip
          if-no-files-found: error
          retention-days: 7
