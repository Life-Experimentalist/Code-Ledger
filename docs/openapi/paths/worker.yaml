/api/health:
  get:
    tags: [health]
    summary: Health check
    description: Returns a minimal JSON health payload for uptime monitoring.
    responses:
      "200":
        description: Health payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthResponse"

/api/app/installations:
  get:
    tags: [app]
    summary: List GitHub App installations
    description: Returns a list of installations for the configured GitHub App. Requires App JWT.
    security:
      - app_jwt: []
    responses:
      "200":
        description: Array of installation objects (proxied from GitHub)
        content:
          application/json: {}

/api/app/installations/{id}/access_tokens:
  post:
    tags: [app]
    summary: Create an installation access token
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    security:
      - app_jwt: []
    responses:
      "201":
        description: Installation access token created (proxied from GitHub)
        content:
          application/json: {}

/api/auth/{provider}:
  get:
    tags: [auth]
    summary: Initiate OAuth flow
    parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum: [github]
    responses:
      "302":
        description: Redirect to provider authorization URL

/api/auth/{provider}/callback:
  get:
    tags: [auth]
    summary: OAuth callback receiver
    description: Returns an HTML page that posts a `CODELEDGER_AUTH` message to the opener window.
    parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum: [github]
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      - in: query
        name: error_description
        schema:
          type: string
    responses:
      "200":
        description: HTML page which posts the token back to the opener window
        content:
          text/html:
            schema:
              type: string

/api/webhook/github:
  post:
    tags: [webhook]
    summary: GitHub webhook receiver
    description: Verifies `x-hub-signature-256` header when configured, then processes webhook payloads.
    parameters:
      - in: header
        name: x-hub-signature-256
        required: false
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json: {}
    responses:
      "200":
        description: Webhook processed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OKResponse"

/api/data/canonical-map.json:
  get:
    tags: [data]
    summary: Canonical map (public)
    description: Returns the canonical map JSON from KV when available, otherwise a raw GitHub fallback.
    responses:
      "200":
        description: Canonical map JSON
        content:
          application/json: {}
      "503":
        description: Canonical map unavailable
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/admin/canonical:
  post:
    tags: [data]
    summary: "Admin: replace canonical map"
    description: Requires a bearer token matching the `CANONICAL_UPLOAD_TOKEN` binding. Stores the posted body into KV at key `canonical-map`.
    security:
      - canonical_token: []
    requestBody:
      required: true
      content:
        text/plain: {}
    responses:
      "200":
        description: Update accepted
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OKResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/post_install:
  get:
    tags: [misc]
    summary: Post-install redirect (GitHub App marketplace)
    parameters:
      - in: query
        name: installation_id
        schema:
          type: string
      - in: query
        name: setup_action
        schema:
          type: string
    responses:
      "302":
        description: Redirect to root with query parameters

/favicon.ico:
  get:
    tags: [misc]
    summary: Favicon redirect
    responses:
      "301":
        description: Redirect to extension icon URL
